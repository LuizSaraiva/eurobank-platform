databaseChangeLog:
  - changeSet:
      id: V001-create-customer-table
      author: Luiz
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: char(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: full_name
                  type: varchar(150)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: varchar(150)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: document_number
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false

              - column:
                  name: kyc_status
                  type: varchar(30)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false